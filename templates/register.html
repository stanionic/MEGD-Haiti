{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white text-center">
                <h3 class="mb-0">
                    <i class="fas fa-user-plus me-2"></i>
                    Créer un compte
                </h3>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="full_name" class="form-label">
                            <i class="fas fa-user me-2"></i>
                            Nom complet
                        </label>
                        <input type="text" class="form-control" id="full_name" name="full_name" 
                               placeholder="Ex: Jean Dupont" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="phone_number" class="form-label">
                            <i class="fab fa-whatsapp me-2"></i>
                            Numéro WhatsApp
                        </label>
                        <input type="tel" class="form-control" id="phone_number" name="phone_number" 
                               placeholder="Ex: +243123456789" required>
                        <div class="form-text">
                            Entrez votre numéro avec l'indicatif du pays (ex: +243 pour RDC)
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="user_type" class="form-label">
                            <i class="fas fa-users me-2"></i>
                            Type de compte
                        </label>
                        <select class="form-select" id="user_type" name="user_type" required>
                            <option value="">Sélectionnez...</option>
                            <option value="student">Étudiant(e)</option>
                            <option value="professor">Professeur(e)</option>
                        </select>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-user-plus me-2"></i>
                            S'inscrire
                        </button>
                    </div>
                </form>

                <hr class="my-4">
                
                <div class="text-center">
                    <p class="mb-0">Vous avez déjà un compte?</p>
                    <a href="{{ url_for('login') }}" class="btn btn-outline-primary mt-2">
                        <i class="fas fa-sign-in-alt me-2"></i>
                        Se connecter
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
